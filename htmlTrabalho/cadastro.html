<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre-se na NatiBraids para agendar seu próximo horário.">
    <meta name="theme-color" content="#123d42">
    <title>Cadastro | NatiBraids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
  </head>
  <body>
    <header class="shell topbar">
      <a class="brand" href="cliente.html" aria-label="NatiBraids início">
        <span class="brand-mark">N</span><span>NatiBraids</span>
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="cliente.html#recursos">Serviços</a>
        <a href="profissionais.html">Profissionais</a>
        <a href="agendamento.html">Agendamento</a>
        <a class="button button-quiet" href="cadastro.html" aria-current="page">Cadastrar</a>
      </nav>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
    </header>

    <main>
      <section class="section appointment-page">
        <div class="shell appointment-layout">
          <div class="appointment-intro">
            <span class="eyebrow">Seu próximo visual</span>
            <h1>Crie seu cadastro.</h1>
            <p>Salve seus dados e agende seu horário com mais praticidade.</p>
            <a class="back-link" href="cliente.html">← Voltar para NatiBraids</a>
          </div>

          <form class="schedule-card" id="client-form">
            <div class="card-top">
              <h2>Cadastro de cliente</h2>
              <span class="status-dot" aria-label="Sistema online"></span>
            </div>
            <div class="form-grid">
              <div class="field full">
                <label for="client-name">Nome completo</label>
                <input id="client-name" name="nome" type="text" autocomplete="name" required>
              </div>
              <div class="field">
                <label for="client-phone">Telefone</label>
                <input id="client-phone" name="telefone" type="tel" autocomplete="tel" placeholder="(41) 99999-9999" required>
              </div>
              <div class="field">
                <label for="client-email">E-mail</label>
                <input id="client-email" name="email" type="email" autocomplete="email" required>
              </div>
              <div class="field">
                <label for="client-password">Senha</label>
                <input id="client-password" name="senha" type="password" minlength="6" autocomplete="new-password" required>
              </div>
              <div class="field">
                <label for="client-password-confirm">Confirmar senha</label>
                <input id="client-password-confirm" type="password" minlength="6" autocomplete="new-password" required>
              </div>
            </div>
            <button class="button button-primary form-button" type="submit">Criar cadastro <span aria-hidden="true">→</span></button>
            <div class="form-message" id="client-message" role="status" aria-live="polite"></div>
          </form>
        </div>
      </section>
    </main>

    <footer class="shell footer">
      <div class="footer-row">
        <small>© 2026 NatiBraids. Cuidando sempre de você.</small>
        <div class="socials" aria-label="Redes sociais"><a href="cliente.html">Instagram</a><a href="cliente.html">Facebook</a><a href="mailto:oi@natibraids.com">Contato</a></div>
      </div>
    </footer>

    <script>
      const apiUrl = "http://localhost:3000";
      const form = document.querySelector("#client-form");
      const message = document.querySelector("#client-message");
      const phoneInput = document.querySelector("#client-phone");
      const menuButton = document.querySelector(".menu-toggle");
      const nav = document.querySelector(".nav");

      function formatPhone(value) {
        const digits = value.replace(/\D/g, "").slice(0, 11);
        if (digits.length <= 2) return digits.length ? `(${digits}` : "";
        if (digits.length <= 7) return `(${digits.slice(0, 2)}) ${digits.slice(2)}`;
        return `(${digits.slice(0, 2)}) ${digits.slice(2, 7)}-${digits.slice(7)}`;
      }

      phoneInput.addEventListener("input", () => {
        phoneInput.value = formatPhone(phoneInput.value);
      });

      form.addEventListener("submit", async event => {
        event.preventDefault();
        const password = document.querySelector("#client-password");
        const confirmation = document.querySelector("#client-password-confirm");
        const submitButton = form.querySelector("button[type='submit']");
        if (password.value !== confirmation.value) {
          message.className = "form-message error";
          message.textContent = "As senhas não coincidem.";
          return;
        }
        submitButton.disabled = true;
        message.className = "form-message";
        try {
          const response = await fetch(`${apiUrl}/clientes`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(Object.fromEntries(new FormData(form)))
          });
          const result = await response.json();
          if (!response.ok) throw new Error(result.error || "Não foi possível concluir o cadastro.");
          message.className = "form-message success";
          message.textContent = "Cadastro realizado com sucesso! Agora você já pode agendar.";
          form.reset();
        } catch (error) {
          message.className = "form-message error";
          message.textContent = error.message.includes("Failed to fetch") ? "Inicie o servidor para concluir o cadastro." : error.message;
        } finally {
          submitButton.disabled = false;
        }
      });

      menuButton.addEventListener("click", () => {
        const isOpen = menuButton.getAttribute("aria-expanded") === "true";
        menuButton.setAttribute("aria-expanded", String(!isOpen));
        nav.style.display = isOpen ? "none" : "flex";
        nav.style.flexDirection = "column";
        nav.style.position = "absolute";
        nav.style.right = "18px";
        nav.style.top = "70px";
        nav.style.background = "#fffdf8";
        nav.style.padding = "18px";
        nav.style.borderRadius = "12px";
        nav.style.boxShadow = "0 12px 30px rgba(18, 61, 66, .14)";
      });
    </script>
  </body>
</html>
