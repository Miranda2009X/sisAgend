<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Conheça sugestões de tranças e cuidados capilares da NatiBraids.">
    <meta name="theme-color" content="#123d42">
    <title>Serviços | NatiBraids</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Playfair+Display:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css.css">
    <link rel="stylesheet" href="page-transitions.css">
  </head>
  <body>
    <header class="shell topbar">
      <a class="brand" href="cliente.html" aria-label="NatiBraids início">
        <span class="brand-mark">N</span><span>NatiBraids</span>
      </a>
      <nav class="nav" aria-label="Navegação principal">
        <a href="cliente.html">Início</a>
        <a href="servicos.html" aria-current="page">Serviços</a>
        <a href="cadastro.html">Cadastrar</a>
        <a href="agendamento.html">Agendamento</a>
      </nav>
      <button class="menu-toggle" type="button" aria-label="Abrir menu" aria-expanded="false">☰</button>
    </header>

    <main>
      <section class="section services-page">
        <div class="shell">
          <div class="section-heading">
            <div>
              <span class="eyebrow">Encontre sua inspiração</span>
              <h1>Sugestões para o seu próximo visual.</h1>
            </div>
            <p>Fotos de referência para tranças e cuidados capilares. Consulte as opções disponíveis ao agendar.</p>
          </div>
          <div class="service-grid">
            <figure class="service-card">
              <img src="imagens/box-braids.jpg" alt="Sugestão de box braids longas com detalhes em miçangas." width="2512" height="2010" loading="lazy" decoding="async">
              <figcaption>
                <span class="feature-number">TRANÇAS</span>
                <h2>Box braids</h2>
                <p>Um visual versátil, com comprimento e acabamento que combinam com seu estilo.</p>
                <small class="service-credit">Foto: <a href="https://commons.wikimedia.org/wiki/File:Box_Braids.jpg" target="_blank" rel="noreferrer">Randen Pederson / Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noreferrer">CC BY 2.0</a></small>
              </figcaption>
            </figure>
            <figure class="service-card">
              <img src="https://upload.wikimedia.org/wikipedia/commons/6/66/Fine_Braids%2C_Dimma_%2813307706094%29.jpg" alt="Sugestão de tranças nagô desenhadas junto ao couro cabeludo." width="2008" height="2012" loading="lazy" decoding="async">
              <figcaption>
                <span class="feature-number">TRANÇAS</span>
                <h2>Tranças nagô</h2>
                <p>Linhas delicadas criam desenhos e valorizam diferentes formas de usar tranças.</p>
                <small class="service-credit">Foto: <a href="https://commons.wikimedia.org/wiki/File:Fine_Braids,_Dimma_(13307706094).jpg" target="_blank" rel="noreferrer">Rod Waddington / Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by-sa/2.0/" target="_blank" rel="noreferrer">CC BY-SA 2.0</a></small>
              </figcaption>
            </figure>
            <figure class="service-card">
              <img src="https://thumb.wikimedia.org/wikipedia/commons/thumb/9/9c/Hair_Oil_Treatment_at_Hair_Salon.jpg/960px-Hair_Oil_Treatment_at_Hair_Salon.jpg" alt="Profissional aplica óleo capilar durante um tratamento no salão." width="960" height="640" loading="lazy" decoding="async">
              <figcaption>
                <span class="feature-number">CUIDADOS</span>
                <h2>Hidratação capilar</h2>
                <p>Uma opção de cuidado para nutrir os fios e complementar seu momento de beleza.</p>
                <small class="service-credit">Foto: <a href="https://geehair.com/" target="_blank" rel="noreferrer">Gee Hair Images</a> / <a href="https://commons.wikimedia.org/wiki/File:Hair_Oil_Treatment_at_Hair_Salon.jpg" target="_blank" rel="noreferrer">Wikimedia Commons</a> · <a href="https://creativecommons.org/licenses/by/2.0/" target="_blank" rel="noreferrer">CC BY 2.0</a></small>
              </figcaption>
            </figure>
          </div>
        </div>
      </section>
    </main>

    <footer class="shell footer">
      <div class="footer-row">
        <small>© 2026 NatiBraids. Cuidando sempre de você.</small>
        <div class="socials" aria-label="Links do site"><a href="cliente.html" aria-label="Instagram">Instagram</a><a href="cliente.html" aria-label="Facebook">Facebook</a><a href="mailto:oi@natibraids.com" aria-label="E-mail">Contato</a><a href="/admin.html">Área administrativa</a></div>
      </div>
    </footer>

    <script>
      const menuButton = document.querySelector(".menu-toggle");
      const nav = document.querySelector(".nav");

      menuButton.addEventListener("click", () => {
        const isOpen = menuButton.getAttribute("aria-expanded") === "true";
        menuButton.setAttribute("aria-expanded", String(!isOpen));
        nav.style.display = isOpen ? "none" : "flex";
        nav.style.flexDirection = "column";
        nav.style.position = "absolute";
        nav.style.right = "18px";
        nav.style.top = "70px";
        nav.style.background = "#fffdf8";
        nav.style.padding = "18px";
        nav.style.borderRadius = "12px";
        nav.style.boxShadow = "0 12px 30px rgba(18, 61, 66, .14)";
      });

      nav.addEventListener("click", event => {
        if (!event.target.closest("a") || !window.matchMedia("(max-width: 780px)").matches) return;
        menuButton.setAttribute("aria-expanded", "false");
        nav.removeAttribute("style");
      });
    </script>
  </body>
</html>
